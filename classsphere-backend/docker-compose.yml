services:
  db:
    image: postgres:16-alpine
    container_name: classsphere_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-classsphere}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db_roles.sql:/docker-entrypoint-initdb.d/init_db_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-classsphere}"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c listen_addresses='*'
      -c shared_preload_libraries=''
      -c log_destination='stderr'
      -c logging_collector='on'
      -c log_min_messages='warning'

volumes:
  postgres_data:
    driver: local
